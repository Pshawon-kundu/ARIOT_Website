<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="topRim" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3DD8F7" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#3DD8F7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0.5" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#3DD8F7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#CBD5E1" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Grid -->
  <rect width="1080" height="1920" fill="url(#grid)"/>

  <!-- Cyan glow -->
  <rect width="1080" height="1920" fill="url(#cyanGlow)"/>

  <!-- Top rim -->
  <rect width="1080" height="1920" fill="url(#topRim)"/>

  <!-- Floor reflection -->
  <ellipse cx="540" cy="1550" rx="400" ry="80" fill="#3DD8F7" opacity="0.06" filter="url(#softGlow)"/>

  <!-- Robotic arm - upper third composition -->
  <!-- Base plate -->
  <ellipse cx="540" cy="1400" rx="240" ry="50" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <ellipse cx="540" cy="1390" rx="200" ry="40" fill="#334155"/>

  <!-- Column -->
  <rect x="490" y="850" width="100" height="540" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>

  <!-- Shoulder -->
  <circle cx="540" cy="850" r="45" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <circle cx="540" cy="850" r="25" fill="#475569"/>
  <circle cx="540" cy="850" r="12" fill="#3DD8F7" opacity="0.5" filter="url(#glow)"/>

  <!-- Upper arm -->
  <g transform="rotate(-20, 540, 850)">
    <rect x="510" y="650" width="60" height="200" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <rect x="518" y="670" width="44" height="30" rx="3" fill="#475569" opacity="0.5"/>
  </g>

  <!-- Elbow -->
  <circle cx="486" cy="680" r="28" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>

  <!-- Forearm -->
  <g transform="rotate(35, 486, 680)">
    <rect x="460" y="540" width="52" height="140" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Cyan wrist LED -->
  <circle cx="480" cy="540" r="5" fill="#3DD8F7" filter="url(#glow)"/>

  <!-- End effector -->
  <g transform="rotate(35, 486, 680)">
    <rect x="472" y="480" width="28" height="60" rx="4" fill="#334155" stroke="#3DD8F7" stroke-width="1" opacity="0.85"/>
    <rect x="476" y="465" width="7" height="18" rx="2" fill="#475569"/>
    <rect x="487" y="465" width="7" height="18" rx="2" fill="#475569"/>
    <circle cx="486" cy="495" r="3" fill="#3DD8F7" opacity="0.6" filter="url(#glow)"/>
  </g>

  <!-- Brushed steel floor - lower third -->
  <rect x="0" y="1500" width="1080" height="420" fill="#E2E8F0"/>
  <line x1="0" y1="1500" x2="1080" y2="1500" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Floor hairline details -->
  <g opacity="0.12">
    <line x1="0" y1="1580" x2="1080" y2="1580" stroke="#94A3B8" stroke-width="0.5"/>
    <line x1="0" y1="1660" x2="1080" y2="1660" stroke="#94A3B8" stroke-width="0.5"/>
    <line x1="0" y1="1740" x2="1080" y2="1740" stroke="#94A3B8" stroke-width="0.5"/>
  </g>

  <!-- Fog streaks -->
  <g opacity="0.04">
    <ellipse cx="540" cy="900" rx="500" ry="30" fill="#3DD8F7" filter="url(#softGlow)" transform="rotate(-8, 540, 900)"/>
    <ellipse cx="650" cy="750" rx="350" ry="25" fill="#3DD8F7" filter="url(#softGlow)" transform="rotate(5, 650, 750)"/>
  </g>

  <!-- Subtle cyan reflection on floor -->
  <ellipse cx="540" cy="1550" rx="200" ry="30" fill="#3DD8F7" opacity="0.05" filter="url(#glow)"/>
</svg>
