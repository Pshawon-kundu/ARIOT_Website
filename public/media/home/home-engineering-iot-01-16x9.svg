<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08090B"/><stop offset="100%" stop-color="#0E1014"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1B1F25" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <!-- Small device on table -->
  <rect x="400" y="550" width="120" height="80" rx="8" fill="#15181E" stroke="#2A3038" stroke-width="1.5"/>
  <circle cx="430" cy="585" r="4" fill="#3DD8F7" filter="url(#glow)"/>
  <line x1="520" y1="585" x2="560" y2="585" stroke="#2A3038" stroke-width="2"/>
  <!-- Antenna signal arcs -->
  <path d="M 460 550 Q 520 480 600 520" stroke="#3DD8F7" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 460 540 Q 540 450 620 500" stroke="#3DD8F7" stroke-width="1" fill="none" opacity="0.3"/>
  <!-- Distant workshop bokeh in background -->
  <g opacity="0.04">
    <circle cx="1200" cy="300" r="80" fill="#2A3038"/>
    <circle cx="1400" cy="250" r="60" fill="#2A3038"/>
    <circle cx="1100" cy="400" r="40" fill="#2A3038"/>
    <circle cx="1500" cy="380" r="50" fill="#2A3038"/>
  </g>
  <!-- Table surface -->
  <rect x="0" y="630" width="1920" height="450" fill="#0E1014"/>
  <line x1="0" y1="630" x2="1920" y2="630" stroke="#1B1F25" stroke-width="1"/>
</svg>