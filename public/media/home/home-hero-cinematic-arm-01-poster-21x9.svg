<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 824" width="1920" height="824">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08090B"/>
      <stop offset="100%" stop-color="#0E1014"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3DD8F7" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#3DD8F7" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#08090B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cyanFade" cx="0.35" cy="0.4" r="0.45">
      <stop offset="0%" stop-color="#3DD8F7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#08090B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#1B1F25" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="1920" height="824" fill="url(#bg)"/>
  <rect width="1920" height="824" fill="url(#grid)" opacity="0.4"/>
  <rect width="1920" height="824" fill="url(#cyanFade)"/>
  <rect width="1920" height="824" fill="url(#rim)"/>

  <!-- Robotic arm (same composition as hero) -->
  <ellipse cx="800" cy="620" rx="220" ry="48" fill="#1B1F25" stroke="#2A3038" stroke-width="1.5"/>
  <ellipse cx="800" cy="610" rx="190" ry="38" fill="#15181E"/>
  <rect x="730" y="350" width="140" height="260" rx="6" fill="#1B1F25" stroke="#2A3038" stroke-width="1"/>
  <circle cx="800" cy="350" r="48" fill="#1B1F25" stroke="#2A3038" stroke-width="1.5"/>
  <circle cx="800" cy="350" r="28" fill="#2A3038"/>
  <circle cx="800" cy="350" r="14" fill="#3DD8F7" opacity="0.3" filter="url(#glow)"/>
  <g transform="rotate(-25, 800, 350)">
    <rect x="765" y="180" width="70" height="170" rx="5" fill="#1B1F25" stroke="#2A3038" stroke-width="1"/>
  </g>
  <circle cx="735" cy="180" r="28" fill="#1B1F25" stroke="#2A3038" stroke-width="1.5"/>
  <g transform="rotate(40, 735, 180)">
    <rect x="710" y="70" width="50" height="110" rx="4" fill="#1B1F25" stroke="#2A3038" stroke-width="1"/>
  </g>
  <circle cx="725" cy="70" r="5" fill="#3DD8F7" filter="url(#glow)"/>
  <g transform="rotate(40, 735, 180)">
    <rect x="718" y="20" width="28" height="50" rx="4" fill="#15181E" stroke="#3DD8F7" stroke-width="1" opacity="0.7"/>
    <rect x="722" y="10" width="6" height="14" rx="2" fill="#2A3038"/>
    <rect x="734" y="10" width="6" height="14" rx="2" fill="#2A3038"/>
  </g>

  <!-- Background gantry -->
  <g opacity="0.12">
    <rect x="1050" y="150" width="6" height="480" fill="#2A3038"/>
    <rect x="1350" y="150" width="6" height="480" fill="#2A3038"/>
    <rect x="1050" y="150" width="306" height="6" fill="#2A3038"/>
  </g>

  <!-- Fog -->
  <g opacity="0.04">
    <ellipse cx="800" cy="380" rx="500" ry="30" fill="#3DD8F7" filter="url(#softGlow)" transform="rotate(-10, 800, 380)"/>
  </g>
</svg>
