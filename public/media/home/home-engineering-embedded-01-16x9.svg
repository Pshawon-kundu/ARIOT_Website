<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08090B"/><stop offset="100%" stop-color="#0E1014"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1B1F25" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <!-- PCB board -->
  <g transform="translate(300,200)">
    <rect x="0" y="0" width="900" height="600" rx="8" fill="#0A0C0E" stroke="#1B1F25" stroke-width="2"/>
    <!-- IC chips -->
    <rect x="80" y="80" width="200" height="200" rx="4" fill="#15181E" stroke="#2A3038" stroke-width="1"/>
    <rect x="360" y="80" width="200" height="200" rx="4" fill="#15181E" stroke="#2A3038" stroke-width="1"/>
    <rect x="80" y="360" width="200" height="100" rx="4" fill="#15181E" stroke="#2A3038" stroke-width="1"/>
    <!-- Traces highlighted in cyan -->
    <path d="M 280 180 L 320 180 L 320 150 L 360 150" stroke="#3DD8F7" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 280 300 L 320 300 L 320 360 L 360 360" stroke="#3DD8F7" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M 560 180 L 600 180 L 600 480 L 640 480" stroke="#3DD8F7" stroke-width="1.5" fill="none" opacity="0.5"/>
    <!-- Connectors -->
    <rect x="820" y="80" width="60" height="40" rx="3" fill="#1B1F25" stroke="#2A3038" stroke-width="1"/>
    <rect x="820" y="480" width="60" height="40" rx="3" fill="#1B1F25" stroke="#2A3038" stroke-width="1"/>
    <!-- Blueprint callout labels -->
    <line x1="80" y1="40" x2="80" y2="20" stroke="#3DD8F7" stroke-width="0.5" opacity="0.4"/>
    <line x1="360" y1="40" x2="360" y2="20" stroke="#3DD8F7" stroke-width="0.5" opacity="0.4"/>
  </g>
</svg>