<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2520 1080" width="2520" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3DD8F7" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#3DD8F7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorGlow" x1="0.5" y1="0.7" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3DD8F7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cyanFade" cx="0.35" cy="0.4" r="0.45">
      <stop offset="0%" stop-color="#3DD8F7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#CBD5E1" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="2520" height="1080" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <rect width="2520" height="1080" fill="url(#grid)" opacity="0.5"/>

  <!-- Cyan radial fade -->
  <rect width="2520" height="1080" fill="url(#cyanFade)"/>

  <!-- Top rim light -->
  <rect width="2520" height="1080" fill="url(#rim)"/>

  <!-- Floor glow reflection -->
  <rect width="2520" height="1080" fill="url(#floorGlow)"/>

  <!-- Robotic arm - chassis base (bottom disc) -->
  <ellipse cx="1000" cy="800" rx="280" ry="60" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <ellipse cx="1000" cy="790" rx="250" ry="50" fill="#334155"/>

  <!-- Robotic arm - main column -->
  <rect x="920" y="450" width="160" height="340" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <rect x="940" y="470" width="120" height="60" rx="4" fill="#475569" opacity="0.6"/>

  <!-- Robotic arm - shoulder joint -->
  <circle cx="1000" cy="450" r="60" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <circle cx="1000" cy="450" r="35" fill="#475569"/>
  <circle cx="1000" cy="450" r="18" fill="#3DD8F7" opacity="0.5" filter="url(#glow)"/>

  <!-- Robotic arm - upper segment -->
  <g transform="rotate(-25, 1000, 450)">
    <rect x="960" y="240" width="80" height="210" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect x="970" y="260" width="60" height="40" rx="3" fill="#475569" opacity="0.5"/>
    <rect x="970" y="380" width="60" height="40" rx="3" fill="#475569" opacity="0.5"/>
  </g>

  <!-- Robotic arm - elbow joint -->
  <circle cx="920" cy="240" r="35" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <circle cx="920" cy="240" r="15" fill="#3DD8F7" opacity="0.3"/>

  <!-- Robotic arm - forearm -->
  <g transform="rotate(40, 920, 240)">
    <rect x="890" y="100" width="60" height="140" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect x="895" y="120" width="50" height="30" rx="3" fill="#475569" opacity="0.5"/>
  </g>

  <!-- Cyan LED signal on wrist -->
  <circle cx="910" cy="100" r="6" fill="#3DD8F7" filter="url(#glow)"/>

  <!-- End effector / gripper -->
  <g transform="rotate(40, 920, 240)">
    <rect x="905" y="40" width="30" height="60" rx="4" fill="#334155" stroke="#3DD8F7" stroke-width="1" opacity="0.85"/>
    <rect x="910" y="25" width="8" height="20" rx="2" fill="#475569"/>
    <rect x="922" y="25" width="8" height="20" rx="2" fill="#475569"/>
    <circle cx="920" cy="55" r="4" fill="#3DD8F7" opacity="0.6" filter="url(#glow)"/>
  </g>

  <!-- Gantry structure in background (deep) -->
  <g opacity="0.18">
    <rect x="1300" y="200" width="8" height="600" fill="#94A3B8"/>
    <rect x="1700" y="200" width="8" height="600" fill="#94A3B8"/>
    <rect x="1300" y="200" width="408" height="8" fill="#94A3B8"/>
  </g>

  <!-- Secondary gantry (far background) -->
  <g opacity="0.1">
    <rect x="150" y="350" width="6" height="450" fill="#CBD5E1"/>
    <rect x="550" y="350" width="6" height="450" fill="#CBD5E1"/>
    <rect x="150" y="350" width="406" height="6" fill="#CBD5E1"/>
  </g>

  <!-- Ambient fog / volumetric light streaks -->
  <g opacity="0.05">
    <ellipse cx="1000" cy="500" rx="600" ry="40" fill="#3DD8F7" filter="url(#softGlow)" transform="rotate(-10, 1000, 500)"/>
    <ellipse cx="1200" cy="400" rx="400" ry="30" fill="#3DD8F7" filter="url(#softGlow)" transform="rotate(5, 1200, 400)"/>
  </g>

  <!-- ARIOT watermark (subtle, bottom-left) -->
  <g opacity="0.12">
    <text x="120" y="1000" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" letter-spacing="6" fill="#64748B">ARIOT</text>
  </g>
</svg>
