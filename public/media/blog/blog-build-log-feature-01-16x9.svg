<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#08090B"/><stop offset="100%" stop-color="#0E1014"/></linearGradient>
    <pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1B1F25" stroke-width="0.5" opacity="0.15"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <!-- Workbench -->
  <rect x="0" y="650" width="1920" height="430" fill="#0E1014"/>
  <line x1="0" y1="650" x2="1920" y2="650" stroke="#1B1F25" stroke-width="1"/>
  <!-- Soldering station -->
  <g transform="translate(400, 400)">
    <rect x="0" y="0" width="180" height="250" rx="6" fill="#1B1F25" stroke="#2A3038" stroke-width="1.5"/>
    <rect x="10" y="10" width="160" height="100" rx="3" fill="#08090B"/>
    <text x="30" y="50" font-family="monospace" font-size="12" fill="#3DD8F7" opacity="0.4">350°C</text>
    <text x="30" y="70" font-family="monospace" font-size="8" fill="#3DD8F7" opacity="0.25">STANDBY</text>
    <!-- Knobs -->
    <circle cx="50" cy="150" r="15" fill="#15181E"/>
    <circle cx="130" cy="150" r="15" fill="#15181E"/>
    <line x1="50" y1="135" x2="50" y2="165" stroke="#2A3038" stroke-width="1"/>
    <line x1="130" y1="135" x2="130" y2="165" stroke="#2A3038" stroke-width="1"/>
    <!-- Iron holder -->
    <rect x="60" y="200" width="60" height="30" rx="4" fill="#1B1F25"/>
  </g>
  <!-- PCB under microscope -->
  <g transform="translate(900, 480)">
    <rect x="0" y="0" width="250" height="170" rx="6" fill="#0A0C0E" stroke="#1B1F25" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="15" fill="#1B1F25"/>
    <rect x="100" y="50" width="80" height="30" rx="3" fill="#15181E"/>
    <path d="M 20 120 L 40 100 L 60 110 L 80 90 L 100 105" fill="none" stroke="#3DD8F7" stroke-width="1.5" opacity="0.5"/>
    <circle cx="80" cy="80" r="3" fill="#3DD8F7" filter="url(#glow)"/>
    <!-- Probe -->
    <line x1="180" y1="30" x2="250" y2="-50" stroke="#2A3038" stroke-width="2"/>
  </g>
  <!-- Oscilloscope -->
  <g transform="translate(1300, 300)">
    <rect x="0" y="0" width="200" height="200" rx="6" fill="#15181E" stroke="#2A3038" stroke-width="1.5"/>
    <rect x="10" y="10" width="180" height="120" rx="3" fill="#08090B"/>
    <path d="M 20 70 L 40 60 L 60 65 L 80 45 L 100 55 L 120 35 L 140 50 L 160 30 L 180 40" fill="none" stroke="#3DD8F7" stroke-width="1.5" opacity="0.6"/>
    <!-- Buttons -->
    <g opacity="0.15">
      <circle cx="25" cy="155" r="6" fill="#2A3038"/>
      <circle cx="60" cy="155" r="6" fill="#2A3038"/>
      <circle cx="95" cy="155" r="6" fill="#2A3038"/>
      <circle cx="130" cy="155" r="6" fill="#2A3038"/>
      <circle cx="165" cy="155" r="6" fill="#2A3038"/>
    </g>
  </g>
</svg>