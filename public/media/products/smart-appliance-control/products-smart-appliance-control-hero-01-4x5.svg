<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#08090B"/><stop offset="100%" stop-color="#0E1014"/></linearGradient>
    <radialGradient id="gl" cx="0.5" cy="0.4" r="0.4"><stop offset="0%" stop-color="#3DD8F7" stop-opacity="0.06"/><stop offset="100%" stop-color="#08090B" stop-opacity="0"/></radialGradient>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B1F25" stroke-width="0.5" opacity="0.2"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#g)"/>
  <rect width="1080" height="1350" fill="url(#gl)"/>
  <!-- In-wall module -->
  <rect x="390" y="520" width="300" height="180" rx="8" fill="#1B1F25" stroke="#2A3038" stroke-width="2"/>
  <rect x="410" y="540" width="260" height="140" rx="5" fill="#15181E"/>
