  <text x="445" y="585" font-family="monospace" font-size="10" fill="#3DD8F7" opacity="0.6">ON</text>
  <!-- Control buttons -->
  <circle cx="470" cy="645" r="12" fill="#2A3038"/>
  <circle cx="510" cy="645" r="12" fill="#2A3038"/>
  <circle cx="550" cy="645" r="12" fill="#2A3038"/>
  <circle cx="590" cy="645" r="12" fill="#3DD8F7" opacity="0.4" filter="url(#glow)"/>
  <!-- Energy meter display -->
  <rect x="555" y="555" width="100" height="60" rx="3" fill="#08090B" stroke="#2A3038" stroke-width="1"/>
  <path d="M 570 590 L 580 580 L 590 585 L 600 575 L 610 580 L 620 570 L 630 575" fill="none" stroke="#3DD8F7" stroke-width="1.5" opacity="0.5"/>
