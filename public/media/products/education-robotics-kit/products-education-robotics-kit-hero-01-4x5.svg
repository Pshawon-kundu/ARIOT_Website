<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#08090B"/><stop offset="100%" stop-color="#0E1014"/></linearGradient>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B1F25" stroke-width="0.5" opacity="0.2"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#g)"/>
  <!-- Dark felt surface -->
  <rect x="0" y="500" width="1080" height="850" fill="#0E1014"/>
  <line x1="0" y1="500" x2="1080" y2="500" stroke="#1B1F25" stroke-width="1"/>
  <!-- Cyan grid on felt -->
  <g opacity="0.06">
    <line x1="0" y1="650" x2="1080" y2="650" stroke="#3DD8F7" stroke-width="0.5"/>
    <line x1="0" y1="750" x2="1080" y2="750" stroke="#3DD8F7" stroke-width="0.5"/>
    <line x1="0" y1="850" x2="1080" y2="850" stroke="#3DD8F7" stroke-width="0.5"/>
    <line x1="200" y1="500" x2="200" y2="1350" stroke="#3DD8F7" stroke-width="0.5"/>
    <line x1="400" y1="500" x2="400" y2="1350" stroke="#3DD8F7" stroke-width="0.5"/>
    <line x1="600" y1="500" x2="600" y2="1350" stroke="#3DD8F7" stroke-width="0.5"/>
    <line x1="800" y1="500" x2="800" y2="1350" stroke="#3DD8F7" stroke-width="0.5"/>
  </g>
  <!-- Kit modules laid out -->
  <rect x="150" y="560" width="200" height="120" rx="6" fill="#1B1F25" stroke="#2A3038" stroke-width="1.5"/>
  <rect x="160" y="570" width="180" height="35" rx="3" fill="#15181E"/>
  <circle cx="220" cy="650" r="10" fill="#2A3038"/>
  <circle cx="260" cy="650" r="10" fill="#2A3038"/>
  <rect x="450" y="560" width="180" height="120" rx="6" fill="#1B1F25" stroke="#2A3038" stroke-width="1.5"/>
  <circle cx="520" cy="610" r="25" fill="#15181E"/>
  <circle cx="520" cy="610" r="8" fill="#3DD8F7" opacity="0.4" filter="url(#glow)"/>
  <rect x="700" y="560" width="160" height="120" rx="6" fill="#1B1F25" stroke="#2A3038" stroke-width="1.5"/>
  <rect x="710" y="570" width="140" height="100" rx="3" fill="#15181E"/>
  <g opacity="0.2">
    <rect x="720" y="580" width="30" height="20" rx="2" fill="#1B1F25"/>
    <rect x="760" y="580" width="30" height="20" rx="2" fill="#1B1F25"/>
    <rect x="800" y="580" width="30" height="20" rx="2" fill="#1B1F25"/>
  </g>
  <!-- Assembled robot -->
  <g transform="translate(540, 380)">
    <circle r="30" fill="#1B1F25" stroke="#2A3038" stroke-width="1.5"/>
    <rect x="-20" y="30" width="40" height="25" rx="4" fill="#15181E"/>
    <circle r="8" fill="#3DD8F7" opacity="0.3" filter="url(#glow)"/>
  </g>
</svg>