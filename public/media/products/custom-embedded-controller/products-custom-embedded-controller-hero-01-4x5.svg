<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#08090B"/><stop offset="100%" stop-color="#0E1014"/></linearGradient>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1B1F25" stroke-width="0.5" opacity="0.15"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#g)"/>
  <!-- Workbench surface -->
  <rect x="0" y="700" width="1080" height="650" fill="#0E1014"/>
  <line x1="0" y1="700" x2="1080" y2="700" stroke="#1B1F25" stroke-width="1"/>
  <!-- Bare PCB -->
  <rect x="200" y="520" width="350" height="180" rx="6" fill="#0A0C0E" stroke="#1B1F25" stroke-width="1.5"/>
  <!-- ICs on PCB -->
  <rect x="230" y="545" width="80" height="60" rx="3" fill="#15181E" stroke="#2A3038" stroke-width="0.5"/>
  <rect x="340" y="545" width="80" height="60" rx="3" fill="#15181E" stroke="#2A3038" stroke-width="0.5"/>
  <rect x="450" y="545" width="60" height="60" rx="3" fill="#15181E" stroke="#2A3038" stroke-width="0.5"/>
  <!-- Cyan probe trace on oscilloscope -->
  <rect x="620" y="440" width="280" height="200" rx="6" fill="#08090B" stroke="#1B1F25" stroke-width="1"/>
  <path d="M 640 540 L 660 535 L 680 545 L 700 520 L 720 530 L 740 500 L 760 515 L 780 480 L 800 490 L 820 470 L 840 485 L 860 460 L 880 475" fill="none" stroke="#3DD8F7" stroke-width="1.5" opacity="0.7"/>
  <text x="640" y="560" font-family="monospace" font-size="7" fill="#3DD8F7" opacity="0.3">CH1 2.00V 10ms</text>
  <!-- Scope probe -->
  <line x1="550" y1="610" x2="640" y2="520" stroke="#2A3038" stroke-width="1.5"/>
  <!-- Soldering iron stand -->
  <g transform="translate(900, 600)" opacity="0.4">
    <ellipse rx="15" ry="5" fill="#1B1F25"/>
    <rect x="-3" y="-40" width="6" height="40" rx="2" fill="#2A3038"/>
    <rect x="-5" y="-50" width="10" height="15" rx="2" fill="#1B1F25"/>
  </g>
  <!-- Cyan accent dot on PCB -->
  <circle cx="300" cy="580" r="3" fill="#3DD8F7" opacity="0.5" filter="url(#glow)"/>
</svg>