<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08090B"/>
      <stop offset="100%" stop-color="#0E1014"/>
    </linearGradient>
    <linearGradient id="warm" x1="0.2" y1="0.6" x2="0.8" y2="0.2">
      <stop offset="0%" stop-color="#E4A853" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#08090B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cyanDot" cx="0.6" cy="0.5" r="0.1">
      <stop offset="0%" stop-color="#3DD8F7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#08090B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1B1F25" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#warm)"/>
  <!-- Room corner structure -->
  <polygon points="0,200 300,200 300,700 800,700 800,1080 0,1080" fill="#0E1014" stroke="#1B1F25" stroke-width="1"/>
  <line x1="300" y1="200" x2="300" y2="700" stroke="#2A3038" stroke-width="1"/>
  <line x1="300" y1="700" x2="800" y2="700" stroke="#2A3038" stroke-width="1"/>
  <!-- Wall -->
  <rect x="300" y="0" width="1620" height="700" fill="#0A0C0E"/>
  <!-- Window -->
  <rect x="1000" y="150" width="400" height="400" rx="4" fill="#08090B" stroke="#1B1F25" stroke-width="1"/>
  <line x1="1200" y1="150" x2="1200" y2="550" stroke="#1B1F25" stroke-width="0.5"/>
  <line x1="1000" y1="350" x2="1400" y2="350" stroke="#1B1F25" stroke-width="0.5"/>
  <!-- Cyan device on wall -->
  <rect x="600" y="450" width="40" height="40" rx="20" fill="#1B1F25" stroke="#2A3038" stroke-width="1"/>
  <circle cx="620" cy="470" r="4" fill="#3DD8F7" filter="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#cyanDot)"/>
</svg>