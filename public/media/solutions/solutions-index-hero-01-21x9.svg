  <!-- Cyan throughline connecting scenes -->
  <path d="M 450 450 Q 475 350 500 450 Q 525 350 550 450 Q 575 350 600 450" stroke="#3DD8F7" stroke-width="1.5" fill="none" opacity="0.3"/>
