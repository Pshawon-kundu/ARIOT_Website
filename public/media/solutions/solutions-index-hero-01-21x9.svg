    <linearGradient id="rim" x1="0.5" y1="0" x2="0.5" y2="1"><stop offset="0%" stop-color="#3DD8F7" stop-opacity="0.08"/><stop offset="100%" stop-color="#08090B" stop-opacity="0"/></linearGradient>
    <pattern id="g" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M 64 0 L 0 0 0 64" fill="none" stroke="#1B1F25" stroke-width="0.5" opacity="0.2"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="2520" height="1080" fill="url(#bg)"/><rect width="2520" height="1080" fill="url(#g)"/><rect width="2520" height="1080" fill="url(#rim)"/>
