  <g opacity="0.12"><rect x="500" y="250" width="400" height="500" rx="8" fill="#1B1F25"/><rect x="530" y="280" width="340" height="350" rx="4" fill="#15181E"/><rect x="550" y="300" width="120" height="80" rx="4" fill="#0A0C0E"/><rect x="700" y="300" width="150" height="80" rx="4" fill="#0A0C0E"/><rect x="550" y="420" width="300" height="80" rx="4" fill="#0A0C0E"/></g>
  <g opacity="0.12"><rect x="950" y="180" width="400" height="500" rx="8" fill="#1B1F25"/><rect x="980" y="210" width="340" height="350" rx="4" fill="#15181E"/><rect x="1000" y="230" width="100" height="60" rx="4" fill="#0E1014"/><rect x="1140" y="230" width="160" height="60" rx="4" fill="#0E1014"/><rect x="1000" y="320" width="200" height="100" rx="4" fill="#0E1014"/></g>
